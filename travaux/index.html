<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toy Story</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: url('images/parquet.jpg') no-repeat center center / cover fixed;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #card-container {
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 1200px;
        }
        
        .toy-card {
            width: 300px;
            background-color: #ffffff;
            border-radius: 20px;
            border: 2px solid #bd6317;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: box-shadow 0.3s ease;
        }

        .toy-card:hover {
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
        }

        .toy-card__image {
            width: 100%;
            height: 250px;
            background-color: #8fa382;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            position: relative;
        }

        .toy-card__image img {
            max-height: 90%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .toy-card:hover .toy-card__image img {
            transform: scale(1.1) translateY(-10px);
        }

        .toy-card__name {
            width: 100%;
            background-color: #e98b33;
            color: #000;
            text-align: center;
            font-weight: bold;
            font-size: 1.4rem;
            padding: 6px 0;
        }

        .toy-card__description {
            padding: 15px;
            color: #666;
            font-size: 0.9rem;
            text-align: center;
            line-height: 1.3;
            height: 80px; /* Hauteur fixe pour aligner proprement les blocs */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toy-card__unit-stats {
            width: 100%;
            background-color: #e98b33;
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 0;
            opacity: 0;
            overflow: hidden;
            transition: height 0.3s ease, opacity 0.3s ease;
        }

        .toy-card:hover .toy-card__unit-stats {
            height: 60px;
            opacity: 1;
        }

        .one-third {
            flex: 1;
            text-align: center;
            color: #ffffff;
            border-right: 1px solid rgba(255, 255, 255, 0.3);
            padding: 5px 0;
        }

        .one-third:last-child {
            border-right: none;
        }

        .stat {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .stat-value {
            font-size: 0.65rem;
            text-transform: uppercase;
        }

        .logo-top-right {
            position: fixed; 
            top: 20px;   
            left: 20px; 
            width: 80px; 
            height: auto;
            z-index: 1000; 
        }
    </style>
</head>

<body>
    <img src="images/toy-story-logo.png" alt="Logo" class="logo-top-right">
    
    <!-- Conteneur qui va accueillir toutes les cartes générées -->
    <div id="card-container"></div>

    <script>
        // Les données JSON intégrées directement (ou tu peux utiliser fetch('datastory.json') si ton site est sur un serveur local)
        const characters = [
            { "nom": "Woody", "vie": "25", "discretion": "22", "action": "40", "photo": "images/woody.png", "info": "Les mains en l'air ! Le shérif Woody est la pour faire régner l ordre dans la chambre d'Andy." },
            { "nom": "Buzz l'éclair", "vie": "35", "discretion": "15", "action": "70", "photo": "images/buzz.png", "info": "Vers l'infini et au-delà !" },
            { "nom": "Pil Poil", "vie": "14", "discretion": "10", "action": "60", "photo": "images/pilpoil.png", "info": "Il cherche à éliminer le grand méchant Zurg. Buzz sait voler grâce à ses ailes déployables." },
            { "nom": "Alien", "vie": "11", "discretion": "12", "action": "10", "photo": "images/alien.png", "info": "Pas fufute mais très gentil" },
            { "nom": "Rex", "vie": "40", "discretion": "24", "action": "50", "photo": "images/rex.png", "info": "Tout dans les muscles !" },
            { "nom": "Jessie", "vie": "37", "discretion": "45", "action": "65", "photo": "images/jessie.png", "info": "Téméraire et intrépide !" },
            { "nom": "Sergent", "vie": "12", "discretion": "60", "action": "75", "photo": "images/sergent.png", "info": "Au service de tous !" },
            { "nom": "Bayonne", "vie": "25", "discretion": "30", "action": "20", "photo": "images/bayonne.png", "info": "Tranquille et économe" },
            { "nom": "ZigZag", "vie": "35", "discretion": "30", "action": "40", "photo": "images/zigzag.png", "info": "Toujours prêt à se plier en 4 pour Woody" },
            { "nom": "Monsieur Patate", "vie": "18", "discretion": "35", "action": "30", "photo": "images/patate.png", "info": "Grincheux mais sympa" }
        ];

        const container = document.getElementById('card-container');

        // Génération dynamique des cartes
        characters.forEach(toy => {
            const card = document.createElement('div');
            card.className = 'toy-card';

            card.innerHTML = `
                <div class="toy-card__image">
                    <img src="${toy.photo}" alt="${toy.nom}">
                </div>
                <div class="toy-card__name">${toy.nom}</div>
                <div class="toy-card__description">${toy.info}</div>
                <div class="toy-card__unit-stats">
                    <div class="one-third">
                        <div class="stat">${toy.vie}</div>
                        <div class="stat-value">Vie</div>
                    </div>
                    <div class="one-third">
                        <div class="stat">${toy.discretion}</div>
                        <div class="stat-value">Discrétion</div>
                    </div>
                    <div class="one-third">
                        <div class="stat">${toy.action}</div>
                        <div class="stat-value">Action</div>
                    </div>
                </div>
            `;

            container.appendChild(card);
        });
    </script>
</body>

</html>
